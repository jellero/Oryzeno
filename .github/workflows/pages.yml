name: Deploy Oryzeno OpenLink

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cat site/oryzeno-openlink-beautiful.b64.part* | base64 --decode > /tmp/oryzeno-openlink-beautiful.zip
          echo "aed4bf0876fec10b9ffcf931db3ade0c620018bdab305becf8d880672dc84d8d  /tmp/oryzeno-openlink-beautiful.zip" | sha256sum --check --strict
          unzip -q /tmp/oryzeno-openlink-beautiful.zip -d _site
          rm -rf _site/.github _site/backend
          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
